<!doctype html>
<html lang="ja" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ブース番号やサークル名から会場内の場所を探せるイベントナビゲーション" />
    <meta name="theme-color" content="#f7f5ef" />
    <script>
      (() => {
        const key = 'booth-navi-ui-theme'
        let theme
        try {
          const saved = localStorage.getItem(key)
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch {}
        theme ||= matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.uiTheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#17171b' : '#f7f5ef'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Booth Navi | Sample Doujin Event 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
